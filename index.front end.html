<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('https://storage.googleapis.com/a1aa/image/4eeaaebb-3c42-4b32-92bd-0e9f8b21055e.jpeg');
             background-size: cover;
            background-position: center; 
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            box-shadow: 0 1px 2px 2px blue;
            text-align: center;
        }
        .login-container h2 {
            color: white;
            margin-bottom: 20px;
        }
        .login-container input {
            width: 93%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            outline: none;
        }
        .login-container input[type="text"],
        .login-container input[type="password"] {
            background-color: #333;
            color: white;
        }
        .login-container button {
            width: 95%;
            padding: 10px;
            background-color: #00b894;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .login-container button:hover {
            background-color: #019d78;
        }
        .login-container a {
            color: #3498db;
            text-decoration: none;
            font-size: 14px;
        }
        .login-container a:hover {
            text-decoration: underline;
        }
        .signup-link {
            margin-top: 10px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Log In</h2>
        <form action="#" method="POST">
            <input type="text" name="useremail" placeholder="Useremail" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <br>
        <a href="#">Forget Password?</a>
        <a href="#" class="signup-link">Sign Up</a>
    </div>
</body>
</html>
